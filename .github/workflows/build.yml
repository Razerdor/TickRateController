name: Build TickRateController

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Configure project
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile mod
        run: cmake --build build --config Release --parallel 2

      - name: Package mod
        run: |
          mkdir -p package
          cp manifest.json package/
          cp build/libtick_rate_controller.so package/
          cd package
          zip -r ../TickRateController.levipack .

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: TickRateController
          path: TickRateController.levipack